<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Website & APP Development Company in Lucknow</title>
    <link rel="shortcut icon" href="images/favicon.png" type="images/x-icon">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/owl.theme.green.min.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div class="d-flex">
        <div class="sidebar p-3 d-flex flex-column">
            <h5 class="text-white fw-bold mb-0">Products</h5><p class="text-secondary">Admin Panel</p>
            <hr class="border-secondary my-3">
            <ul class="nav flex-column gap-1">
                <li><a href="dashboard.html" class="nav-link"><i class="fa fa-table-cells me-2"></i> Dashboard</a></li>
                <li><a href="products.html" class="nav-link active"><i class="fa fa-cube me-2"></i> Products</a></li>
                <li><a href="gallery.html" class="nav-link"><i class="fa fa-images me-2"></i> Gallery</a></li>
                <li><a href="contact1.html" class="nav-link"><i class="fa fa-envelope me-2"></i> Contact Enquiries</a>
                </li>
                <li><a href="enquiries.html" class="nav-link"><i class="fa fa-inbox me-2"></i> Enquiries</a></li>
                <li><a href="settings.html" class="nav-link"><i class="fa fa-gear me-2"></i> Settings</a></li>
            </ul>
            <div class="mt-auto"><a href="#" class="text-danger small text-decoration-none"><i
                        class="fa fa-right-from-bracket me-2"></i> Logout</a></div>
        </div>
        <div class="main-area bg-light">
            <div class="bg-white border-bottom p-3 d-flex justify-content-between">
                <h6 class="fw-bold" style="color:#7a214f;">Products</h6><span class="avatar">A</span>
            </div>
            <div class="p-4">
                <div class="d-flex justify-content-between mb-3">
                    <h4>Products</h4><button class="btn text-white" style="background:#7a214f;" data-bs-toggle="modal"
                        data-bs-target="#addModal">+ Add Product</button>
                </div>
                <div class="card border-0 shadow-sm">
                    <table class="table mb-0">
                        <tr>
                            <th>Product</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        <tr>
                            <td>Direct Gas Fired Ribbon Oven</td>
                            <td><span class="badge bg-success">Active</span></td>
                            <td><button class="btn btn-sm btn-primary">Edit</button> <button
                                    class="btn btn-sm btn-danger">Delete</button></td>
                        </tr>
                        <tr>
                            <td>Tin Printing Travelling Oven</td>
                            <td><span class="badge bg-success">Active</span></td>
                            <td><button class="btn btn-sm btn-primary">Edit</button> <button
                                    class="btn btn-sm btn-danger">Delete</button></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="addModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Add Product</h5><button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><input type="text" class="form-control mb-2" placeholder="Product Name"><input
                        type="text" class="form-control mb-2" placeholder="Category"><select class="form-select mb-2">
                        <option>Active</option>
                        <option>Inactive</option>
                    </select><textarea class="form-control" placeholder="Description"></textarea></div>
                <div class="modal-footer"><button class="btn btn-secondary"
                        data-bs-dismiss="modal">Cancel</button><button class="btn text-white"
                        style="background:#7a214f;">Save</button></div>
            </div>
        </div>
    </div>


    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
